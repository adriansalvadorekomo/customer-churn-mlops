# Logstash: keep the structured events, route everything else to a plain log index.
#
# src/observability.py prints one JSON object per line (event, service, fields).
# Those land in churn-events-* with their fields under [churn]; uvicorn and
# Prefect text lines go to churn-logs-* untouched, for debugging.
input {
  beats { port => 5044 }
}

filter {
  if [message] =~ /^\{.*"event"/ {
    json {
      source => "message"
      target => "churn"
      tag_on_failure => ["churn_json_failure"]
    }
    if "churn_json_failure" not in [tags] {
      # The event's own timestamp, not the time Filebeat read the line.
      date {
        match => ["[churn][@timestamp]", "ISO8601"]
        target => "@timestamp"
      }
      mutate {
        remove_field => ["message", "[churn][@timestamp]"]
        add_field => { "[@metadata][index]" => "churn-events" }
      }
    }
  }
  if ![@metadata][index] {
    mutate { add_field => { "[@metadata][index]" => "churn-logs" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
