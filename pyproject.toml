[project]
name = "workshop-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "pandas>=3.0.6",
    "prefect>=3.8.6",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.53.0",
]

# The exploratory notebook is the project's historical artifact (see
# docs/howToDoModular.md, which quotes its code verbatim); the quality gates
# lint the maintained code only.
[tool.ruff]
extend-exclude = ["notebooks", "docs/howToDoModular.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
# One config for the scan-security gate (src/tasks.py) and CI: `bandit -c pyproject.toml -r .`
# Every severity fails, except two rules reviewed for this code base:
#   B404 import of subprocess, B603 subprocess without shell=True. The pipeline runs
#   git / uv / ruff / pytest with fixed argument lists, never shell=True.
exclude_dirs = ["tests", ".venv", "frontend", "notebooks", "docs", "models", "mlruns"]
skips = ["B404", "B603"]
