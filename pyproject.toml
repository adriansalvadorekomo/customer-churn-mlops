[project]
name = "workshop-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "pandas>=3.0.6",
    "prefect>=3.8.6",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.53.0",
]

# The exploratory notebook is the project's historical artifact (see
# docs/howToDoModular.md); the quality gates lint the maintained code only.
[tool.ruff]
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
